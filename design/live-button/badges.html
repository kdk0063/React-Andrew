<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Badge Round 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#0C0D0F;--paper:#FFFFFF;--red:#D7261E;--gold:#E9A23B;--blue:#1B5FAA;--green:#22C55E;--mono:"IBM Plex Mono",monospace;--sans:"Archivo",sans-serif;--ease:cubic-bezier(.7,0,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding:40px clamp(16px,4vw,64px) 80px}
h1{font-weight:800;font-variation-settings:'wdth' 80;font-size:40px;letter-spacing:-.02em;margin:0 0 6px}
p.lead{font:400 13px var(--mono);color:#55575c;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.cell{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:22px 22px 26px;display:flex;flex-direction:column;gap:18px}
.cell.dark{background:var(--ink);color:#fff}
.tag{font:500 12px var(--mono);letter-spacing:.1em}
.tag small{display:block;margin-top:6px;font-weight:400;letter-spacing:0;opacity:.6;line-height:1.5}
.stage{height:220px;display:grid;place-items:center}
a{color:inherit;text-decoration:none}
.b{position:relative;width:150px;height:150px;display:grid;place-items:center;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.b svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring text{font:500 11px var(--mono);letter-spacing:.3em;fill:currentColor;text-transform:uppercase}
.spin{animation:spin 16s linear infinite;transform-origin:50% 50%}
.spin.rev{animation-direction:reverse;animation-duration:22s}
.b:hover .spin{animation-duration:4s}.b:hover .spin.rev{animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.6s ease-out infinite}
@keyframes ping{to{transform:scale(2.8);opacity:0}}

/* 01 Refined: ring + live dot + arrow that turns */
.b1 .core{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background .4s,transform .5s var(--ease)}
.b1 .core svg{width:22px;height:22px;transition:transform .5s var(--ease)}
.b1:hover .core{background:var(--red);transform:scale(1.12)}
.b1:hover .core svg{transform:rotate(45deg)}
.b1 .live{position:absolute;top:50%;left:50%;margin:-30px 0 0 18px;border:2px solid var(--paper);box-sizing:content-box}

/* 02 Compass: needle sways, then swings to NE on hover */
.b2 .rose{width:100px;height:100px;transform:rotate(-8deg);animation:sway 3.2s ease-in-out infinite;transition:transform .9s cubic-bezier(.3,1.5,.4,1)}
.b2:hover .rose{animation:none;transform:rotate(-45deg)}
@keyframes sway{50%{transform:rotate(8deg)}}
.b2 .tick{stroke:currentColor;stroke-width:1}

/* 03 Broadcast: sonar pulses behind a LIVE core */
.b3 .wave{position:absolute;width:70px;height:70px;border-radius:50%;border:1.5px solid var(--red);animation:wave 2.4s ease-out infinite;opacity:0}
.b3 .wave:nth-child(2){animation-delay:.8s}.b3 .wave:nth-child(3){animation-delay:1.6s}
@keyframes wave{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.15);opacity:0}}
.b3 .core{position:relative;width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font:500 10px var(--mono);letter-spacing:.18em;line-height:1.5;transition:transform .5s var(--ease)}
.b3 .core b{display:block;font:800 19px var(--sans);font-variation-settings:'wdth' 75;letter-spacing:.02em}
.b3:hover .core{transform:scale(1.12)}
.b3:hover .wave{animation-duration:1.2s}

/* 04 Starburst sticker: rotating scalloped star, upright text */
.b4 .star{position:absolute;inset:0;width:100%;height:100%;animation:spin 20s linear infinite}
.b4 .star path{fill:var(--gold);transition:fill .4s}
.b4:hover .star{animation-duration:5s}
.b4:hover .star path{fill:var(--ink)}
.b4 .txt{position:relative;text-align:center;font:500 10px var(--mono);letter-spacing:.2em;line-height:1.35;transition:color .4s,transform .5s var(--ease)}
.b4 .txt b{display:block;font:800 26px var(--sans);font-variation-settings:'wdth' 70;letter-spacing:.01em;line-height:.95}
.b4:hover .txt{color:#fff;transform:rotate(-8deg) scale(1.08)}

/* 05 Orbit: gold star orbits the ring; inner ring counter-rotates */
.b5 .orbit{position:absolute;inset:0;animation:spin 6s linear infinite}
.b5 .orbit svg{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px}
.b5:hover .orbit{animation-duration:1.6s}
.b5 .core{width:58px;height:58px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:20px;transition:background .4s,color .4s}
.b5:hover .core{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* 06 Double ring on ink */
.b6 .core{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;transition:transform .5s var(--ease),background .4s}
.b6 .core svg{width:18px;height:18px}
.b6:hover .core{transform:scale(1.3) rotate(45deg);background:var(--gold)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>Live badge — round 2</h1>
<p class="lead">All moving. Hover each one; they also lean toward your cursor.</p>
<div class="grid" id="g"></div>
<script>
// Circle path for text ring of radius r centred in a 150 box; textLength = circumference so the loop closes cleanly
const ring=(id,r,txt,cls='spin')=>{const c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 150 150"><g class="${cls}"><defs><path id="${id}" d="M75,75 m-${r},0 a${r},${r} 0 1,1 ${2*r},0 a${r},${r} 0 1,1 -${2*r},0"/></defs><text><textPath href="#${id}" textLength="${c.toFixed(1)}" lengthAdjust="spacing">${txt}</textPath></text></g></svg>`;};
const arrow=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const arrowNE=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg>`;
// Compass rose: split diamonds, long gold east point
const rose=`<svg class="rose" viewBox="-50 -50 100 100">
 <circle r="46" fill="none" class="tick" stroke-dasharray="1 5.2"/>
 <path d="M0 0L0 -34L-7 0Z" fill="currentColor"/><path d="M0 0L0 -34L7 0Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
 <path d="M0 0L0 34L7 0Z" fill="currentColor"/><path d="M0 0L0 34L-7 0Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
 <path d="M0 0L-30 0L0 7Z" fill="currentColor"/><path d="M0 0L-30 0L0 -7Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
 <path d="M0 0L44 0L0 -8Z" fill="#E9A23B"/><path d="M0 0L44 0L0 8Z" fill="#C6801F"/>
 <circle r="3" fill="currentColor"/></svg>`;
const burst=(()=>{let d='',n=16;for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?63:74;d+=(i?'L':'M')+(75+r*Math.cos(a)).toFixed(1)+' '+(75+r*Math.sin(a)).toFixed(1);}return `<svg class="star" viewBox="0 0 150 150"><path d="${d}Z"/></svg>`;})();
const star=`<svg viewBox="-10 -10 20 20"><path d="M0 -10L2.4 -2.4L10 0L2.4 2.4L0 10L-2.4 2.4L-10 0L-2.4 -2.4Z" fill="#E9A23B"/></svg>`;
const cells=[
 ['01 · RING, REFINED','Tighter type, live dot on top, arrow turns ↗ and core goes red.','',`<a class="b b1 mag" href="#">${ring('r1',62,'Visit live site · thegrandstands.net · ')}<span class="live dot"></span><span class="core">${arrow}</span></a>`],
 ['02 · COMPASS','Brand mark as the button. Needle sways like a real compass, swings to ↗ on hover.','',`<a class="b b2 mag" href="#">${ring('r2',68,'Live now · Point east · Visit site · ')}${rose}</a>`],
 ['03 · BROADCAST','“On air” sonar pulses. Pulses quicken on hover.','',`<a class="b b3 mag" href="#"><span class="wave"></span><span class="wave"></span><span class="wave"></span><span class="core"><span>ON AIR<b>LIVE</b>VISIT ↗</span></span></a>`],
 ['04 · STARBURST','Gold sticker that rotates. Turns ink and tilts on hover.','',`<a class="b b4 mag" href="#">${burst}<span class="txt">SEE IT<b>LIVE</b>VISIT ↗</span></a>`],
 ['05 · ORBIT','Your east star orbits the ring, text counter-rotates.','',`<a class="b b5 mag" href="#">${ring('r5',58,'Live · Visit the site · Live · Visit the site · ','spin rev')}<span class="orbit">${star}</span><span class="core">↗</span></a>`],
 ['06 · DOUBLE RING, DARK','Two text rings turning opposite ways. For dark sections.','dark',`<a class="b b6 mag" href="#">${ring('r6a',66,'Visit live site · Visit live site · ')}${ring('r6b',40,'Live now · Live now · Live now · ','spin rev')}<span class="core">${arrowNE}</span></a>`],
];
document.getElementById('g').innerHTML=cells.map(([t,s,cls,h])=>`<div class="cell ${cls}"><div class="tag">${t}<small>${s}</small></div><div class="stage">${h}</div></div>`).join('');
// Magnetic hover: badge leans toward the cursor
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
 document.querySelectorAll('.mag').forEach(el=>{
  el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;el.style.transform=`translate(${x*.22}px,${y*.22}px)`;});
  el.addEventListener('mouseleave',()=>{el.style.transform='';});
 });
}
</script>
</body>
</html>
