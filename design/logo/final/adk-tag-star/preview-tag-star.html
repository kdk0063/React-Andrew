<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;padding:32px;width:1200px;background:#fff}
  .row{display:flex;gap:24px;margin-bottom:24px}
  .tile{flex:1;border:1px solid #e3e3e3;border-radius:14px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:240px}
  .dark{background:#0A0A0A;border-color:#0A0A0A}
  .blue{background:#2F5FA6;border-color:#2F5FA6}
  .small{display:flex;gap:22px;align-items:center}
  p{font-size:12px;color:#888}
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><img src="adk-tag-star-lockup.svg" width="380"><p>adk-tag-star-lockup.svg</p></div>
    <div class="tile dark"><img src="adk-tag-star-lockup-white.svg" width="380"><p>adk-tag-star-lockup-white.svg</p></div>
  </div>
  <div class="row">
    <div class="tile"><img src="adk-tag-star-gold.svg" width="300"><p>adk-tag-star-gold.svg</p></div>
    <div class="tile blue"><img src="adk-tag-star-white.svg" width="300"><p>white on east blue (the star shows the background through)</p></div>
    <div class="tile"><div class="small"><img src="adk-tag-star.svg" width="160"><img src="adk-tag-star.svg" width="90"><img src="adk-tag-star.svg" width="48"></div><p>160 / 90 / 48 px wide</p></div>
  </div>
</body>
</html>
