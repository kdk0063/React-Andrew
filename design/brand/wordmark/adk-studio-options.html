<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADK Studio wordmark</title>
<style>
:root{--stone:#BDB8B0;--ink:#1F1D1B;--red:#B7282E;--gold:#F5C902;}
body{margin:0;background:#BDB8B0;color:#1F1D1B;font:15px/1.5 "Helvetica Neue",Arial,sans-serif;padding:32px 16px 60px;}
h1{font-size:28px;letter-spacing:-.02em;margin:0;}p.l{color:#4A4540;max-width:48em;margin:8px 0 24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
.card{background:#C9C4BC;border:1px solid #A39E95;padding:18px;}
.card h2{margin:0;font-size:15px;}.k{font:11px/1.4 Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#888;}
.card p{margin:4px 0 14px;color:#4A4540;font-size:13.5px;}
.av{border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none}
.av svg{display:block;height:auto}
.hero{display:flex;justify-content:center;padding:6px 0 16px}
.ig{background:#0C1014;color:#F5F5F5;display:flex;align-items:center;gap:16px;padding:16px;font:600 15px system-ui}
.ig small{display:block;font-weight:400;color:#A8A8A8;font-size:12px}
.tiny{display:flex;align-items:center;gap:14px;margin-top:12px;font:11px Menlo,monospace;color:#777}
.hdr{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid #EEE;margin-top:14px;padding-top:12px;font:11px Menlo,monospace;letter-spacing:.08em;color:#777}
</style></head><body>
<h1>ADK Studio — wordmark, letters redrawn</h1>
<p class="l">The ADK STUDIO. wordmark in your redrawn custom letters, set straight on the page with no badge: on stone, and reversed on ink. Each card shows it large, in a header bar, and at footer size.</p>
<div class="grid" id="g"></div>
<script>
// Draft-2 letter shapes, redrawn for any stroke weight s (cap height 100).
// Strokes sit fully inside the cap height (centrelines at s/2), round letters overshoot by OV,
// and each letter has its own side bearings: straight sides get more room than round or diagonal ones.
const OV=2.5;
const ext=(x1,y1,x2,y2,e)=>{const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;return [x1-ux*e,y1-uy*e,x2+ux*e,y2+uy*e];};
function glyph(ch,s){
  const c=s/2, T=c-OV, B=100-c+OV;
  switch(ch){
  case 'A':{const w=86,x0=s*.62;const [a1,b1]=ext(w/2,0,x0,100,0).slice(2).length?[x0-(w/2-x0)/100*s,100+s]:0;return {w,sb:[1,1],clip:[0,100],d:`M${a1} ${b1} L${w/2} 0 L${w-a1} ${b1} M${s*.9+12} 64 H${w-s*.9-12}`};}
  case 'D':{const w=82,k=40,rx=w-c-k,ry=50-c;return {w,sb:[8,5],clip:[0,100],d:`M${c} ${c} H${k} A${rx} ${ry} 0 0 1 ${k} ${100-c} H${c} Z`};}
  case 'K':{const w=74,ay=62,bx=w-s*.45;            // arm runs on into the stem and is trimmed flush with its left edge: one solid join
            const ax=-s, ayy=ay+(ay/(bx-c))*(c+s);           // extend the arm line past the stem centre to x=-s
            const px=c+(bx-c)*.36, py=ay-ay*.36, qx=w-s*.4, qy=100;  // leg springs from the arm, its start tucked inside the arm
            const L=Math.hypot(qx-px,qy-py), sx=px-(qx-px)/L*s*.3, sy=py-(qy-py)/L*s*.3;
            return {w,sb:[8,0],clip:[0,100],d:`M${c} 0 V100 M${bx+(bx-c)/ay*s} ${-s} L${ax} ${ayy} M${sx} ${sy} L${qx+(qx-px)/(qy-py)*s} ${qy+s}`};}
  case 'T':{const w=72;return {w,sb:[1,1],clip:[0,100],d:`M0 ${c} H${w} M${w/2} 0 V100`};}
  case 'U':{const w=76,rx=(w-s)/2,top=56;return {w,sb:[8,8],clip:[0,100+OV],d:`M${c} 0 V${top} A${rx} ${B-top} 0 0 0 ${w-c} ${top} V0`};}
  case 'I':{return {w:s,sb:[8,8],clip:[0,100],d:`M${c} 0 V100`};}
  case 'O':{const w=94,rx=w/2-c,ry=50-c+OV;return {w,sb:[5,5],clip:[-OV,100+OV],d:`M${w/2} ${T} A${rx} ${ry} 0 1 0 ${w/2} ${B} A${rx} ${ry} 0 1 0 ${w/2} ${T}`};}
  case 'S':{const w=66,l=c,r=w-c,m=w/2;   // top bowl a touch narrower than the bottom, spine through the middle
     return {w,sb:[5,5],clip:[-OV,100+OV],d:`M${r-2} ${T+19} C${r-5} ${T+6} ${m+9} ${T} ${m} ${T} C${l+9} ${T} ${l+2} ${T+8} ${l+2} ${T+21} C${l+2} 37 ${m-8} 44 ${m} 47 C${m+12} 51 ${r} 57 ${r} 72 C${r} ${B-8} ${m+11} ${B} ${m} ${B} C${l+9} ${B} ${l} ${B-6} ${l-1} ${B-21}`};}
  case '.':return {w:s,sb:[5,0],dot:true};
  }}
const SPACE=40;
function word(t,s,dot){let x=0,out='',clips='';const id='k'+Math.random().toString(36).slice(2,7);
  [...t].forEach((ch,i)=>{if(ch===' '){x+=SPACE;return;}const g=glyph(ch,s);x+=g.sb[0];
    if(g.dot)out+=`<rect x="${x}" y="${100-s}" width="${s}" height="${s}" fill="${dot||'currentColor'}" stroke="none"/>`;
    else{clips+=`<clipPath id="${id}${i}"><rect x="${x}" y="${g.clip[0]}" width="${g.w}" height="${g.clip[1]-g.clip[0]}"/></clipPath>`;
         out+=`<g clip-path="url(#${id}${i})"><path transform="translate(${x} 0)" d="${g.d}"/></g>`;}
    x+=g.w+g.sb[1];});
  const first=glyph(t[0],s).sb[0];return [`<defs>${clips}</defs><g transform="translate(${-first} 0)">${out}</g>`,x-first];}
function svg(lines,s,o={}){const lead=o.lead||150;let W=0;const parts=lines.map(l=>{const r=word(l,s,o.dot);W=Math.max(W,r[1]);return r;});
  const H=100+lead*(lines.length-1);
  const body=parts.map(([g,w],i)=>`<g transform="translate(${(W-w)/2} ${i*lead})">${g}</g>`).join('');
  return {W,H,s:`<svg viewBox="0 ${-OV} ${W} ${H+2*OV}" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" role="img" aria-label="ADK Studio.">${body}</svg>`};}
// draft 2 as it was, for comparison
const G0={"A": [90, "M6 94 L45 6 L84 94 M21 66 H69"], "B": [72, "M6 6 V94 M6 6 H38 A22 22 0 0 1 38 50 H6 M38 50 H42 A24 22 0 0 1 42 94 H6"], "C": [94, "M82.7 20.6 A44 44 0 1 0 82.7 79.4"], "D": [84, "M6 6 V94 M6 6 H40 A38 44 0 0 1 40 94 H6"], "E": [62, "M58 6 H6 V94 H58 M6 50 H50"], "F": [60, "M58 6 H6 V94 M6 50 H50"], "G": [100, "M82.7 20.6 A44 44 0 1 0 94 50 H54"], "H": [76, "M6 6 V94 M70 6 V94 M6 50 H70"], "I": [12, "M6 6 V94"], "J": [58, "M52 6 V64 A23 30 0 0 1 6 64"], "K": [74, "M6 6 V94 M70 6 L6 58 M26 40 L70 94"], "L": [56, "M6 6 V94 H52"], "M": [104, "M6 94 V6 L52 66 L98 6 V94"], "N": [78, "M6 94 V6 L72 94 V6"], "O": [100, "M50 6 A44 44 0 1 0 50 94 A44 44 0 1 0 50 6"], "P": [68, "M6 94 V6 H38 A24 24 0 0 1 38 54 H6"], "Q": [102, "M50 6 A44 44 0 1 0 50 94 A44 44 0 1 0 50 6 M50 94 H102"], "R": [72, "M6 94 V6 H38 A24 24 0 0 1 38 54 H6 M34 54 L66 94"], "S": [66, "M60 28 C60 12 46 6 34 6 C18 6 8 14 8 28 C8 42 20 47 34 50 C48 53 60 60 60 72 C60 86 48 94 34 94 C18 94 8 88 6 70"], "T": [76, "M6 6 H70 M38 6 V94"], "U": [76, "M6 6 V62 A32 32 0 0 0 70 62 V6"], "V": [88, "M6 6 L44 94 L82 6"], "W": [120, "M6 6 L30 94 L60 24 L90 94 L114 6"], "X": [76, "M6 6 L70 94 M70 6 L6 94"], "Y": [76, "M6 6 L38 50 L70 6 M38 50 V94"], "Z": [68, "M6 6 H62 L6 94 H62"]};
function draft2(t,sw){let x=0,o='';for(const ch of t){if(ch===' '){x+=50;continue;}const [w,d]=G0[ch];o+=`<path transform="translate(${x} 0)" d="${d}"/>`;x+=w+16;}
  return `<svg viewBox="-2 -2 ${x-12} 104" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="butt" stroke-linejoin="miter" style="width:100%;display:block"><defs><clipPath id="d2"><rect x="-10" y="0" width="5000" height="100"/></clipPath></defs><g clip-path="url(#d2)">${o}</g></svg>`;}
const W=(m,css)=>m.s.replace('<svg',`<svg style="display:block;${css}"`);
const O=[
 {k:'1',t:'One line on stone',d:'Ink letters straight on the stone page, seal-red full stop.',bg:'#BDB8B0',fg:'#1F1D1B',lines:['ADK STUDIO.'],sw:15},
 {k:'2',t:'Stacked on stone',d:'ADK over STUDIO, for square spots like a profile picture or the footer.',bg:'#BDB8B0',fg:'#1F1D1B',lines:['ADK','STUDIO.'],sw:16,lead:134},
 {k:'3',t:'One line on ink',d:'Reversed: stone letters on ink, seal-red full stop.',bg:'#1F1D1B',fg:'#BDB8B0',lines:['ADK STUDIO.'],sw:15},
 {k:'4',t:'Stacked on ink',d:'Reversed and stacked.',bg:'#1F1D1B',fg:'#BDB8B0',lines:['ADK','STUDIO.'],sw:16,lead:134},
];
document.getElementById('g').innerHTML=`<div class="card" style="grid-column:1/-1"><div class="k">Letters · before and after</div><h2>Draft 2 thickened (before) vs redrawn (after)</h2><div style="max-width:560px;color:#1F1D1B">${draft2('ADK STUDIO',17)}</div><div style="max-width:560px;margin-top:22px;color:#1F1D1B">${W(svg(['ADK STUDIO.'],15,{dot:'#B7282E'}),'width:100%')}</div></div>`+
 O.map(o=>{const m=svg(o.lines,o.sw,{dot:'#B7282E',lead:o.lead}),one=o.lines.length===1;
 return `<div class="card"><div class="k">Option ${o.k}</div><h2>${o.t}</h2><p>${o.d}</p>
 <div style="background:${o.bg};color:${o.fg};padding:56px 32px;display:flex;justify-content:center">${W(m,one?'width:88%':'width:58%')}</div>
 <div style="background:${o.bg};color:${o.fg};margin-top:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:11px Menlo,monospace;letter-spacing:.08em">
   ${W(svg(['ADK STUDIO.'],15,{dot:'#B7282E'}),'width:128px;flex:none')}<span style="opacity:.75">WORK · B-SIDES · CONTACT</span></div>
 <div style="background:${o.bg};color:${o.fg};margin-top:10px;padding:12px 18px;display:flex;align-items:center;gap:18px;font:11px Menlo,monospace;opacity:1">
   ${W(m,'height:14px;width:auto')}<span style="opacity:.7">footer size</span></div></div>`;}).join('');
</script></body></html>
