<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADK Studio — Andrew Kim’s creative space for design and code</title>
  <meta name="description" content="ADK Studio is Andrew Kim’s creative space for design and code: websites, tools and experiments, shown as they were built.">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="ADK Studio">
  <meta property="og:description" content="A creative space for design, code and better business.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/adk.css">
  <style>
    /* One screen: a short intro above a slow, endless drift of project
       screens. Each screen floats on its own beat; hovering the strip
       pauses it, and clicking a screen opens that book in the library. */
    body{min-height:100vh;display:flex;flex-direction:column;}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vh,72px) 0 clamp(16px,3vh,32px);}
    .intro{text-align:center;}
    .intro h1{font-size:clamp(34px,5vw,64px);margin:16px auto 0;max-width:16ch;}
    .intro .lede{margin:18px auto 0;max-width:30em;}
    .intro .cta{margin-top:28px;display:flex;justify-content:center;gap:12px;}

    .float{position:relative;margin-top:clamp(32px,6vh,64px);overflow:hidden;padding:30px 0 40px;
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
              mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);}
    .float-track{display:flex;align-items:center;gap:48px;width:max-content;padding-right:48px;
      animation:drift 90s linear infinite;}
    .float:hover .float-track,.float:focus-within .float-track{animation-play-state:paused;}
    @keyframes drift{to{transform:translateX(-50%);}}

    .screen{--r:0deg;--d:0s;flex:none;display:block;text-decoration:none;color:var(--ink);
      transform:rotate(var(--r));animation:bob 7s ease-in-out infinite;animation-delay:var(--d);
      transition:scale .3s ease;}
    .screen:hover,.screen:focus-visible{scale:1.05;}
    @keyframes bob{50%{transform:rotate(var(--r)) translateY(-12px);}}
    .screen .frame{display:block;background:#fff;border:1px solid var(--rule);overflow:hidden;
      box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -12px rgba(0,0,0,.22);}
    .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;}
    .browser .frame{width:clamp(250px,24vw,340px);border-radius:10px;}
    .browser .bar{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--paper-2);}
    .browser .bar i{width:7px;height:7px;border-radius:50%;background:#C9C9C6;}
    .browser .shot{display:block;aspect-ratio:16/10;}
    .phone .frame{width:clamp(108px,10vw,144px);aspect-ratio:9/19;border-radius:22px;padding:5px;background:var(--ink);border-color:var(--ink);}
    .phone img{border-radius:17px;background:#fff;}
    .mockup .bare{display:block;width:clamp(150px,13vw,190px);}
    .mockup img{height:auto;object-fit:contain;mix-blend-mode:multiply;}
    .cap{display:block;margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center;}

    .foot-line{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:0 var(--pad) 28px;margin:0;}

    @media (prefers-reduced-motion:reduce){
      .float{-webkit-mask-image:none;mask-image:none;}
      .float-track{animation:none;flex-wrap:wrap;justify-content:center;width:auto;padding:0 var(--pad);row-gap:40px;}
      .float-track [aria-hidden="true"]{display:none;}
      .screen{animation:none;transition:none;}
    }
  </style>
</head>
<body>

<header class="site-head">
  <div class="shell">
    <a class="brand" href="/" aria-label="ADK Studio home"><span class="lockup"><img class="logo" src="/brand/adk-tag.svg" alt="" width="62" height="30"><span class="sub">Studio</span></span></a>
    <nav class="nav" aria-label="Main">
      <a class="link" href="/projects/">Projects</a>
      <a class="btn btn-primary" href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="shell intro">
    <p class="label">ADK Studio · Andrew Kim</p>
    <h1 class="display">A creative space for design, code and better business.</h1>
    <p class="lede">I love good design as much as clean code. Here are some of the things I’ve made.</p>
    <div class="cta">
      <a class="btn btn-primary" href="/projects/">See projects</a>
    </div>
  </div>

  <div class="float" aria-label="Project screens">
    <div class="float-track" id="float-track"></div>
  </div>
</main>

<p class="foot-line">© 2026 ADK Studio · 東奎</p>

<script>
(function(){
  // One entry per screen. kind: browser (16:10 window), phone (tall,
  // framed here) or mockup (image already has its own device frame).
  var SCREENS = [
    { book:'allenscabinets', kind:'browser', src:'/work/allenskb/home.jpg', cap:'allenscabinets.com' },
    { book:'beoncarrier', kind:'mockup', src:'/work/beon-carrier/mobile-bids.jpg', cap:'Beon Carrier · app' },
    { book:'grandstand', kind:'browser', src:'/work/grandstand/scene-monza.jpg', cap:'Grandstand' },
    { book:'allensadmin', kind:'browser', src:'/work/allens-admin/crm-pipeline.jpg', cap:'Custom CRM' },
    { book:'allenscabinets', kind:'phone', src:'/work/allenskb/mobile.jpg', cap:'allenscabinets.com · mobile' },
    { book:'beoncarrier', kind:'browser', src:'/work/beon-carrier/web-bids.jpg', cap:'Beon Carrier' },
    { book:'kidian', kind:'browser', src:'/work/kidian/hero.jpg', cap:'Kidian' },
    { book:'allenscabinets', kind:'browser', src:'/work/allenskb/book-1.jpg', cap:'Showroom booking' },
    { book:'beoncarrier', kind:'mockup', src:'/work/beon-carrier/mobile-load.jpg', cap:'Load details' }
  ];
  var track = document.getElementById('float-track');
  var tilts = ['-2deg','1.5deg','-1deg','2deg','-1.5deg','1deg'];

  function card(s, i, copy) {
    var a = document.createElement('a');
    a.className = 'screen ' + s.kind;
    a.href = '/projects/#book/' + s.book;
    a.style.setProperty('--r', tilts[i % tilts.length]);
    a.style.setProperty('--d', (-(i * 0.9) % 7).toFixed(2) + 's');
    if (copy) { a.setAttribute('aria-hidden', 'true'); a.tabIndex = -1; }
    else a.setAttribute('aria-label', s.cap + ': open in projects');
    // mockup: an image that already includes its own device frame.
    var inner = s.kind === 'browser'
      ? '<span class="frame"><span class="bar"><i></i><i></i><i></i></span><span class="shot"><img src="' + s.src + '" alt="" loading="lazy"></span></span>'
      : s.kind === 'mockup'
        ? '<span class="bare"><img src="' + s.src + '" alt="" loading="lazy"></span>'
        : '<span class="frame"><img src="' + s.src + '" alt="" loading="lazy"></span>';
    a.innerHTML = inner + '<span class="cap">' + s.cap + '</span>';
    return a;
  }
  // Two copies back to back so the drift loops without a seam.
  SCREENS.forEach(function (s, i) { track.appendChild(card(s, i, false)); });
  SCREENS.forEach(function (s, i) { track.appendChild(card(s, i, true)); });
})();
</script>
</body>
</html>
