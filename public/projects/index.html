<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  if (reduce || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('js-reveal');
  // Fail open: if the observer never fires, the content still shows.
  setTimeout(function(){ items.forEach(function(el){ el.classList.add('in'); }); }, 2000);
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
  items.forEach(function(el){ io.observe(el); });
})();
</script>
<script>
// Replay the 東奎 stroke-order animation every time the footer scrolls into view
(function(){
  var f=document.getElementById('foot-line');
  if(!f||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  f.classList.add('armed');
  new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){f.classList.remove('play');void f.offsetWidth;f.classList.add('play');}
    else f.classList.remove('play');
  });},{threshold:0.6}).observe(f);
})();
</script>
